name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (detector + SKILL.md validation)
        run: python -m unittest discover -s tests -v
      - name: Detector smoke run
        run: |
          python skills/legal-launch-audit/scripts/detect.py tests/fixtures/sample-app --format json > /dev/null
          python skills/legal-launch-audit/scripts/detect.py tests/fixtures/clean-site --fail-on P0
